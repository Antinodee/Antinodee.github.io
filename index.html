    <canvas id="particles"></canvas>

    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useEffect } = React;

        function Portfolio() {
            useEffect(() => {
                const canvas = document.getElementById('particles');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                for (let i = 0; i < 100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 2
                    });
                }

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(79, 70, 229, 0.5)';
                        ctx.fill();

                        particles.forEach(p2 => {
                            const dx = p.x - p2.x;
                            const dy = p.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 150) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = `rgba(79, 70, 229, ${0.2 * (1 - dist / 150)})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        });
                    });
                    requestAnimationFrame(animate);
                }
                animate();

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            }, []);

            return (
                <>

                            <li><a href="#contact">Contact</a></li>

                                <p className="hero-description">
                                    Transforming complex data into actionable insights through machine learning and statistical analysis, while building scalable, production-ready software systems. I combine data science expertise with software engineering best practices to create intelligent applications that solve real-world problems.
                                </p>
                                <div className="cta-group">
                                    <a href="#projects" className="btn btn-primary">View My Work</a>
                                    <a href="https://github.com/Antinodee" target="_blank" className="btn btn-secondary">GitHub</a>
                                </div>
                            </div>
                        </div>

                                <h2 className="section-title">About Me</h2>

                            </div>
                            <div className="about-text">
                                <p>
                                    I'm a Master's student in Computer Science at the University of Nevada, Las Vegas, specializing in machine learning, data engineering, full-stack web development, and software engineering. My passion lies in transforming raw data into meaningful insights while building robust, scalable software systems that bring those insights to life.
                                </p>
                                <p>
                                    From building churn prediction models with 100% accuracy to architecting data warehouses analyzing millions in revenue, creating automated code review tools using AST parsing, and developing full-stack web applications—I combine statistical rigor with software engineering excellence. I believe the best solutions emerge at the intersection of data science, machine learning, and clean, maintainable code.
                                </p>
                            </div>

                                <div className="skill-card">
                                    <span className="skill-icon">🧠</span>
                                    <h3 className="skill-title">Machine Learning</h3>
                                    <p className="skill-description">
                                        Building predictive models with TensorFlow, scikit-learn, and PyTorch. From feature engineering to model deployment.
                                    </p>
                                    <div className="skill-tags">
                                        <span className="skill-tag">TensorFlow</span>

                                        <span className="skill-tag">PyTorch</span>
                                        <span className="skill-tag">NLP</span>
                                    </div>

                                    <p>TensorFlow, PyTorch, scikit-learn, Keras, XGBoost, Random Forest, Neural Networks, NLP, BERT, Transformers</p>
